name: Run Database Migrations

# Runs pending migrations against production and/or staging databases.
# Supports both the main app DB (db/migrations/) and the CRM DB (services/cms/db/).
#
# Manual-only — migrations run automatically via entrypoint.sh on Railway deploy.
# Use this workflow for ad-hoc runs against production/staging.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - 'production'
          - 'staging'
          - 'both'
      database:
        description: 'Which database(s) to migrate'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'main'
          - 'crm'
      dry_run:
        description: 'Dry run — show what would run without executing'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # ─── Main DB — Production ──────────────────────────────────────────
  migrate-main-prod:
    name: Main DB → Production
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.environment != 'staging' && github.event.inputs.database != 'crm'
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret not set"
            exit 1
          fi
          chmod +x db/migrations/run.sh
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          echo "=== Main DB → Production ==="
          psql "$DATABASE_URL" -c "SELECT 1 AS connection_ok;" -tA
          ./db/migrations/run.sh $FLAGS
          echo "--- Migration status ---"
          ./db/migrations/run.sh --status

  # ─── Main DB — Staging ─────────────────────────────────────────────
  migrate-main-staging:
    name: Main DB → Staging
    runs-on: ubuntu-latest
    if: >-
      (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'both') &&
      github.event.inputs.database != 'crm'
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::STAGING_DATABASE_URL secret not set"
            exit 1
          fi
          chmod +x db/migrations/run.sh
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          echo "=== Main DB → Staging ==="
          psql "$DATABASE_URL" -c "SELECT 1 AS connection_ok;" -tA
          ./db/migrations/run.sh $FLAGS
          echo "--- Migration status ---"
          ./db/migrations/run.sh --status

  # ─── CRM DB — Production ──────────────────────────────────────────
  migrate-crm-prod:
    name: CRM DB → Production
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.environment != 'staging' && github.event.inputs.database != 'main'
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run CRM migrations
        env:
          # Renamed CMS_DATABASE_URL → CRM_DATABASE. Both are read so the GitHub secret and this
          # workflow can be updated at different moments without a window in which migrations
          # silently stop.
          CRM_DATABASE: ${{ secrets.CRM_DATABASE }}
          CMS_DATABASE_URL: ${{ secrets.CMS_DATABASE_URL }}
        run: |
          CONN="${CRM_DATABASE:-${CMS_DATABASE_URL:-}}"
          if [ -z "$CONN" ]; then
            # A ::warning:: + exit 0 used to live here, so an unset secret was a SILENT SKIP and the
            # workflow stayed green while the CRM database went un-migrated. That is B145's shape:
            # a step that finds a problem and does not fail the run reports the opposite of what it
            # found. The main-DB job above already uses ::error::; so does this one now.
            echo "::error::Neither CRM_DATABASE nor CMS_DATABASE_URL is set."
            echo "If the CRM database is INTERNAL to Railway's private network — which is the"
            echo "intended posture — this job cannot reach it from GitHub Actions at all, and the"
            echo "migrations belong in a release step on the rfp-crm service instead."
            echo "See docs/RAILWAY_ENV_VARS.md §CRM database."
            exit 1
          fi
          export CRM_DATABASE="$CONN"
          chmod +x services/cms/db/run.sh
          echo "=== CRM DB → Production ==="
          psql "$CRM_DATABASE" -c "SELECT 1 AS connection_ok;" -tA
          services/cms/db/run.sh
          echo "--- CRM migration status ---"
          services/cms/db/run.sh --status

  # ─── CRM DB — Staging ─────────────────────────────────────────────
  migrate-crm-staging:
    name: CRM DB → Staging
    runs-on: ubuntu-latest
    if: >-
      (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'both') &&
      github.event.inputs.database != 'main'
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run CRM migrations
        env:
          CRM_DATABASE: ${{ secrets.CRM_STAGING_DATABASE }}
          CMS_DATABASE_URL: ${{ secrets.CMS_STAGING_DATABASE_URL }}
        run: |
          CONN="${CRM_DATABASE:-${CMS_DATABASE_URL:-}}"
          export CRM_DATABASE="$CONN"
          if [ -z "$CONN" ]; then
            echo "::warning::CMS_STAGING_DATABASE_URL not set — skipping CRM staging migrations"
            exit 0
          fi
          chmod +x services/cms/db/run.sh
          echo "=== CRM DB → Staging ==="
          psql "$CRM_DATABASE" -c "SELECT 1 AS connection_ok;" -tA
          services/cms/db/run.sh
          echo "--- CRM migration status ---"
          services/cms/db/run.sh --status
