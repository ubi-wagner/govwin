<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;background:#ffffff}
  .box{display:inline-block;padding:0}
  #logo{padding:16px 20px 22px}
  .wm-row{display:flex;align-items:baseline;line-height:1}
  .rfp{font-weight:900;letter-spacing:-.03em;color:#1a1816;font-size:52px}
  .pipe{font-family:Georgia,serif;font-style:italic;color:#e85d4a;font-size:52px;margin-left:.09em}
  .arrow{display:flex;align-items:center;gap:6px;margin-top:4px;width:270px}
  .line{flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,#f47a64,#e85d4a)}
  .dot{width:11px;height:11px;border-radius:50%;background:#2d8b4e}
  .tag{text-transform:uppercase;letter-spacing:.34em;font-weight:600;color:#968775;font-size:11px;margin-top:9px}
  svg.ic{width:80px;height:80px;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
</style></head><body>
<div id="logo" class="box">
  <div class="wm-row"><span class="rfp">RFP</span><span class="pipe">Pipeline</span></div>
  <div class="arrow"><span class="line"></span><span class="dot"></span></div>
  <div class="tag">Apply &middot; Curate &middot; Draft &middot; Win</div>
</div>
<div id="icons"></div>
<svg width="0" height="0"><defs>
  <symbol id="non-dilutive" viewBox="0 0 24 24"><circle cx="10.5" cy="11.5" r="6"/><text x="10.5" y="14.8" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" stroke="none">$</text><rect x="14.8" y="15" width="6.2" height="5" rx="1"/><path d="M16.3 15v-1.4a1.8 1.8 0 0 1 3.4-.8"/></symbol>
  <symbol id="automation" viewBox="0 0 24 24"><path d="M3.4 12h13.2M14.6 9.4 17.8 12l-3.2 2.6"/><circle cx="5" cy="12" r="1.9"/><circle cx="11" cy="12" r="1.9"/><path d="M8 9.8v4.4"/></symbol>
  <symbol id="radar" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7a5 5 0 0 1 5 5"/><path d="M12 12 19 5.5"/><circle cx="17" cy="7" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="expert" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5.2"/><path d="M12 6.4l.9 1.9 2 .3-1.5 1.4.35 2L12 12l-1.75.9.35-2L9.1 9.6l2-.3z" fill="currentColor" stroke="none"/><path d="M9.4 13.5 8 21l4-2 4 2-1.4-7.5"/></symbol>
  <symbol id="library" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.3"/><path d="M15.3 17l1.1 1.1 2.3-2.5"/></symbol>
  <symbol id="agent" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="2.6"/><path d="M12 5.2V8"/><circle cx="12" cy="4.4" r="1.1"/><circle cx="9.6" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="14.4" cy="13" r="1.3" fill="currentColor" stroke="none"/><path d="M9.8 16.4h4.4"/></symbol>
  <symbol id="collaboration" viewBox="0 0 24 24"><circle cx="8.6" cy="8" r="2.7"/><path d="M3.7 18.8c0-2.9 2.2-4.8 4.9-4.8 1 0 2 .27 2.8.74"/><circle cx="15.6" cy="9.3" r="2.4"/><path d="M12.5 15.4c.8-.74 1.9-1.16 3.1-1.16 2.5 0 4.5 1.8 4.5 4.5"/></symbol>
  <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3l7 2.3v5.2c0 4.3-3 7.1-7 9-4-1.9-7-4.7-7-9V5.3z"/></symbol>
  <symbol id="funding" viewBox="0 0 24 24"><circle cx="9.8" cy="9.8" r="6.4"/><text x="9.8" y="13.1" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor" stroke="none">$</text><circle cx="17.6" cy="17.4" r="3.7"/><path d="M16 17.4l1.1 1.1 2-2.2"/></symbol>
  <symbol id="trophy" viewBox="0 0 24 24"><path d="M8 4h8v4.5a4 4 0 0 1-8 0z"/><path d="M8 5.2H5.4a2.6 2.6 0 0 0 3.1 3.1M16 5.2h2.6a2.6 2.6 0 0 1-3.1 3.1"/><path d="M12 12.5v3.5M9 20h6M10 20l.6-4h2.8l.6 4"/></symbol>
</defs></svg>
<script>
  const names=['non-dilutive','automation','radar','expert','library','agent','collaboration','shield','funding','trophy'];
  const wrap=document.getElementById('icons');
  names.forEach(n=>{const d=document.createElement('div');d.className='box';d.id='ic-'+n;d.style.padding='8px';
    d.innerHTML='<svg class="ic" viewBox="0 0 24 24" style="color:#d44432"><use href="#'+n+'"/></svg>';wrap.appendChild(d);});
</script></body></html>
