<title>Architecture Explorer — govtech_intel</title>
<style>
  :root {
    --ink:#141922; --paper:#e9edf2; --surface:#f6f8fb; --raised:#ffffff;
    --muted:#55606e; --faint:#7f8b99; --line:#d3dae2; --line-soft:#e5e9ef;
    --trace:#0c7280; --trace-ink:#075661; --loop:#5a4fc4; --loop-ink:#443aa6;
    --good:#2f8f5b; --warn:#a06008; --alert:#b0342a;
    /* subsystem chip lightness/sat, hue supplied inline via --h */
    --csat:46%; --cbg:92%; --cbd:80%; --ctsat:52%; --ctxt:30%;
    --shadow:0 1px 2px rgba(20,25,34,.06),0 10px 34px -20px rgba(20,25,34,.30);
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ink:#e7ecf2; --paper:#0d1117; --surface:#141a22; --raised:#1a212b;
    --muted:#9aa6b4; --faint:#6b7787; --line:#29323e; --line-soft:#212a35;
    --trace:#35c6cf; --trace-ink:#7fe3e6; --loop:#9a8dff; --loop-ink:#c3baff; --good:#56c98a;
    --warn:#e0a54a; --alert:#f0736a;
    --csat:40%; --cbg:21%; --cbd:32%; --ctsat:66%; --ctxt:74%;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px -22px rgba(0,0,0,.7);
  }}
  :root[data-theme="dark"]{
    --ink:#e7ecf2; --paper:#0d1117; --surface:#141a22; --raised:#1a212b;
    --muted:#9aa6b4; --faint:#6b7787; --line:#29323e; --line-soft:#212a35;
    --trace:#35c6cf; --trace-ink:#7fe3e6; --loop:#9a8dff; --loop-ink:#c3baff; --good:#56c98a;
    --warn:#e0a54a; --alert:#f0736a;
    --csat:40%; --cbg:21%; --cbd:32%; --ctsat:66%; --ctxt:74%;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px -22px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  a{color:var(--trace-ink);}
  :focus-visible{outline:2px solid var(--trace);outline-offset:2px;border-radius:3px;}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;}
  .mono{font-family:var(--font-mono);}

  /* ---- top bar ---- */
  .top{display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--raised);flex-wrap:wrap;flex:0 0 auto;}
  .brand{display:flex;flex-direction:column;gap:.05rem;margin-right:.4rem;}
  .brand b{font-size:.95rem;letter-spacing:-.01em;}
  .brand span{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);}
  /* align-items:center, not the default stretch: once a fourth tab narrowed this row the meta
     chips wrapped to a second line and the live-rows chip stretched to the full height and
     width of the wrapped container — a 410x60 green slab where a pill belongs. */
  .meta{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;}
  .mchip{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:.16rem .55rem;background:var(--surface);white-space:nowrap;align-self:center;}
  .tabs{display:flex;gap:.25rem;margin-left:auto;}
  .tab{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.02em;padding:.36rem .7rem;border-radius:7px;border:1px solid transparent;color:var(--muted);}
  .tab[aria-selected="true"]{color:var(--trace-ink);border-color:color-mix(in oklab,var(--trace) 40%,var(--line));background:color-mix(in oklab,var(--trace) 9%,transparent);}
  .tab:hover{color:var(--ink);}
  .tgl{font-family:var(--font-mono);font-size:.7rem;border:1px solid var(--line);border-radius:7px;padding:.36rem .55rem;color:var(--muted);}
  .tgl:hover{border-color:var(--trace);color:var(--ink);}

  /* ---- body ---- */
  .body{flex:1 1 auto;display:flex;min-height:0;}
  .view{flex:1 1 auto;min-height:0;display:none;}
  .view.on{display:flex;}

  /* ---- sidebar (schema) ---- */
  .side{flex:0 0 288px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--raised);}
  .search{padding:.6rem;border-bottom:1px solid var(--line-soft);}
  .search input{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--font-mono);font-size:.8rem;}
  .search input::placeholder{color:var(--faint);}
  .subfilter{display:flex;flex-wrap:wrap;gap:.25rem;padding:.5rem .6rem;border-bottom:1px solid var(--line-soft);}
  .sflag{font-size:.66rem;font-family:var(--font-mono);padding:.14rem .42rem;border-radius:20px;border:1px solid;cursor:pointer;}
  .list{overflow-y:auto;flex:1 1 auto;padding:.35rem;}
  .grp{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:.7rem .5rem .3rem;display:flex;align-items:center;gap:.5ch;}
  .grp .gc{width:.5rem;height:.5rem;border-radius:2px;}
  .trow{display:flex;align-items:center;gap:.5ch;width:100%;text-align:left;padding:.32rem .5rem;border-radius:6px;font-family:var(--font-mono);font-size:.78rem;color:var(--ink);}
  .trow:hover{background:color-mix(in oklab,var(--ink) 6%,transparent);}
  .trow[aria-current="true"]{background:color-mix(in oklab,var(--trace) 13%,transparent);color:var(--trace-ink);}
  .trow .tdot{width:.5rem;height:.5rem;border-radius:50%;flex:0 0 auto;}
  .trow .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .trow .tm{margin-left:auto;font-size:.66rem;color:var(--faint);}

  /* ---- detail pane ---- */
  .detail{flex:1 1 auto;overflow-y:auto;padding:1.3rem clamp(1rem,3vw,2rem);min-width:0;}
  .dhead{display:flex;align-items:center;gap:.7ch;flex-wrap:wrap;}
  .dhead h2{font-family:var(--font-mono);font-size:1.35rem;letter-spacing:-.01em;margin:0;}
  .subchip{font-family:var(--font-mono);font-size:.68rem;padding:.16rem .5rem;border-radius:20px;background:hsl(var(--h) var(--csat) var(--cbg));color:hsl(var(--h) var(--ctsat) var(--ctxt));border:1px solid hsl(var(--h) var(--csat) var(--cbd));}
  .badge{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:.05rem .35rem;}
  .mchip.live,.badge.live{color:var(--good);border-color:color-mix(in oklab,var(--good) 42%,var(--line));background:color-mix(in oklab,var(--good) 10%,transparent);}
  .dsub{color:var(--muted);font-size:.85rem;margin:.35rem 0 0;}

  .sectitle{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:1.7rem 0 .6rem;}

  /* neighborhood graph */
  .graph-wrap{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow-x:auto;box-shadow:var(--shadow);}
  .graph-wrap svg{display:block;width:100%;height:auto;min-width:640px;}
  .gnode{height:44px;border-radius:8px;border:1px solid hsl(var(--h) var(--csat) var(--cbd));background:hsl(var(--h) var(--csat) var(--cbg));display:flex;flex-direction:column;justify-content:center;padding:0 .6rem;cursor:pointer;overflow:hidden;font-family:var(--font-mono);}
  .gnode:hover{filter:brightness(1.04);border-color:hsl(var(--h) var(--ctsat) 50%);}
  .gnode b{font-size:.74rem;color:hsl(var(--h) var(--ctsat) var(--ctxt));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .gnode small{font-size:.6rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gnode.center{background:var(--raised);border:2px solid var(--trace);}
  .gnode.center b{color:var(--trace-ink);font-size:.82rem;}
  .gempty{padding:2.2rem;text-align:center;color:var(--faint);font-family:var(--font-mono);font-size:.8rem;}

  /* fields table */
  .fields{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:.78rem;}
  .fields th{text-align:left;font-weight:600;color:var(--faint);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .6rem;border-bottom:1px solid var(--line);}
  .fields td{padding:.32rem .6rem;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  .fields tr:hover td{background:color-mix(in oklab,var(--ink) 4%,transparent);}
  .fields .fn{color:var(--ink);}
  .fields .ft{color:var(--muted);}
  .kpk{color:#fff;background:var(--trace);border-radius:4px;padding:.02rem .3rem;font-size:.58rem;letter-spacing:.06em;}
  .kfk{color:var(--loop-ink);border:1px solid color-mix(in oklab,var(--loop) 45%,var(--line));border-radius:4px;padding:.02rem .3rem;font-size:.58rem;cursor:pointer;}
  .kfk:hover{background:color-mix(in oklab,var(--loop) 12%,transparent);}
  .nn{color:var(--faint);font-size:.62rem;}
  .fwrap{border:1px solid var(--line);border-radius:10px;overflow-x:auto;}

  /* relationship lists */
  .rels{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;}
  @media(max-width:680px){.rels{grid-template-columns:1fr;}}
  .rel h4{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;color:var(--muted);margin:0 0 .5rem;font-weight:600;}
  .relchips{display:flex;flex-wrap:wrap;gap:.35rem;}
  .rchip{font-family:var(--font-mono);font-size:.72rem;padding:.2rem .5rem;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;}
  .rchip:hover{border-color:var(--trace);color:var(--trace-ink);}
  .rchip .via{color:var(--faint);}

  /* overview (no selection) */
  .ov{padding:1.6rem clamp(1rem,3vw,2rem);overflow-y:auto;}
  .ov h3{font-size:1.1rem;letter-spacing:-.01em;margin:0 0 .3rem;}
  .ov p{color:var(--muted);max-width:64ch;margin:.2rem 0 1.3rem;font-size:.9rem;}
  .subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.7rem;}
  .subcard{border:1px solid var(--line);border-left:3px solid hsl(var(--h) var(--ctsat) 50%);border-radius:10px;padding:.8rem .9rem;background:var(--raised);cursor:pointer;box-shadow:var(--shadow);}
  .subcard:hover{border-color:hsl(var(--h) var(--ctsat) 50%);}
  .subcard b{font-size:.9rem;}
  .subcard .n{font-family:var(--font-mono);font-size:.66rem;color:var(--faint);float:right;}

  /* flows view */
  .flows{overflow:auto;padding:1.4rem clamp(1rem,3vw,2rem);width:100%;}
  .trace{border:1px solid var(--line);border-radius:12px;background:var(--raised);margin-bottom:1rem;box-shadow:var(--shadow);overflow:hidden;}
  .trace>.h{display:flex;align-items:baseline;gap:.8ch;flex-wrap:wrap;padding:.8rem 1rem;border-bottom:1px solid var(--line-soft);border-left:3px solid var(--k,var(--trace));}
  .trace.loop>.h{--k:var(--loop);}
  .trace .tg{font-family:var(--font-mono);font-weight:700;font-size:.72rem;color:var(--k,var(--trace));}
  .trace.loop .tg{color:var(--loop-ink);}
  .trace .nm{font-weight:650;}
  .flow{display:flex;align-items:stretch;gap:0;padding:.9rem 1rem;overflow-x:auto;}
  .fnode{flex:0 0 auto;min-width:9rem;max-width:14rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:.45rem .6rem;display:flex;flex-direction:column;gap:.15rem;}
  .fnode.tbl{cursor:pointer;border-color:color-mix(in oklab,var(--trace) 40%,var(--line));}
  .fnode.tbl:hover{background:color-mix(in oklab,var(--trace) 10%,var(--surface));}
  .fnode .pl{font-family:var(--font-mono);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
  .fnode .id{font-family:var(--font-mono);font-size:.72rem;line-height:1.25;word-break:break-word;}
  .fnode.tbl .id{color:var(--trace-ink);}
  .far{flex:0 0 auto;display:grid;place-items:center;width:1.7rem;color:var(--trace);font-family:var(--font-mono);}
  .trace.loop .far{color:var(--loop);}
  .tnote{padding:0 1rem .9rem;color:var(--muted);font-size:.82rem;}

  /* uis view */
  .uis{overflow:auto;padding:1.4rem clamp(1rem,3vw,2rem);width:100%;}
  .uigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.8rem;}
  .uicard{border:1px solid var(--line);border-radius:11px;background:var(--raised);padding:.9rem 1rem;box-shadow:var(--shadow);}
  .uicard b{font-size:.92rem;}
  .uicard .rt{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin:.2rem 0 .6rem;word-break:break-all;}
  .uicard .relchips{gap:.3rem;}

  /* ---- live view ---- */
  /* `.liveview`, NOT `.live` — `live` was already a MODIFIER on `.mchip`/`.badge` (the green
     'rows · live' pill and the row-estimate badge). A view container called `.live` therefore
     also matched those pills and handed them `width:100%` and 1.4rem of padding: the header
     chip rendered as a 413x64 green slab. Two different meanings of one class name, colliding
     silently — the page still returned 200 and every test still passed. */
  .liveview{overflow:auto;padding:1.4rem clamp(1rem,3vw,2rem);width:100%;}
  .epoch{border:1px solid var(--line);border-left:3px solid var(--k,var(--good));border-radius:11px;background:var(--raised);padding:.85rem 1rem;margin-bottom:1.1rem;box-shadow:var(--shadow);}
  .epoch.unanchored{--k:var(--warn);}
  .epoch b{font-size:.9rem;}
  .epoch p{margin:.3rem 0 0;color:var(--muted);font-size:.82rem;max-width:78ch;}
  .epoch code{font-family:var(--font-mono);font-size:.76rem;background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;padding:.05rem .3rem;}
  .kchips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.3rem;}
  .kchip{display:flex;flex-direction:column;gap:.1rem;align-items:flex-start;border:1px solid var(--line);border-top:3px solid var(--k,var(--faint));border-radius:9px;background:var(--raised);padding:.55rem .85rem;min-width:9.5rem;box-shadow:var(--shadow);}
  .kchip:hover{border-color:var(--k,var(--trace));}
  .kchip[aria-pressed="true"]{background:color-mix(in oklab,var(--k,var(--trace)) 11%,var(--raised));}
  .kchip .kn{font-family:var(--font-mono);font-size:1.25rem;line-height:1.1;color:var(--k,var(--ink));font-variant-numeric:tabular-nums;}
  .kchip .kl{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);}
  .k-live{--k:var(--good);} .k-read_only{--k:var(--trace);}
  .k-written_unread{--k:var(--alert);} .k-untouched{--k:var(--faint);}
  .lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:1rem;align-items:start;}
  .lcard{border:1px solid var(--line);border-radius:11px;background:var(--raised);box-shadow:var(--shadow);overflow:hidden;}
  .lcard>h4{margin:0;padding:.7rem .9rem;border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:1ch;}
  .lcard .bd{padding:.7rem .9rem;}
  .lcard p.why{margin:0 0 .7rem;color:var(--muted);font-size:.8rem;}
  .bars{display:flex;flex-direction:column;gap:.3rem;}
  .bar{display:grid;grid-template-columns:11rem 1fr auto;align-items:center;gap:.6ch;font-family:var(--font-mono);font-size:.74rem;text-align:left;width:100%;padding:.1rem .15rem;border-radius:5px;}
  .bar:hover{background:color-mix(in oklab,var(--ink) 6%,transparent);}
  .bar .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--trace-ink);}
  .bar .bt{height:.5rem;border-radius:3px;background:color-mix(in oklab,var(--good) 55%,transparent);min-width:2px;}
  .bar .bv{color:var(--faint);font-size:.68rem;font-variant-numeric:tabular-nums;}
  .tlist{display:flex;flex-wrap:wrap;gap:.35rem;}
  .lempty{color:var(--faint);font-family:var(--font-mono);font-size:.76rem;}
  /* activity dot on the sidebar rows + the class badge on a table's detail */
  .adot{width:.42rem;height:.42rem;border-radius:50%;flex:0 0 auto;background:var(--k,var(--faint));}
  .badge.act{color:var(--k,var(--faint));border-color:color-mix(in oklab,var(--k,var(--line)) 45%,var(--line));background:color-mix(in oklab,var(--k,var(--line)) 10%,transparent);}
  .askbox{border:1px solid var(--line);border-radius:11px;background:var(--raised);padding:.9rem 1rem;margin-top:1.2rem;box-shadow:var(--shadow);}
  .askrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;}
  .askrow input{flex:1 1 20rem;min-width:0;padding:.45rem .6rem;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:.82rem;}
  .askrow input::placeholder{color:var(--faint);}
  .askrow button{border:1px solid var(--trace);border-radius:7px;padding:.45rem .8rem;font-family:var(--font-mono);font-size:.76rem;color:var(--trace-ink);background:color-mix(in oklab,var(--trace) 10%,transparent);}
  .askrow button:hover:not(:disabled){background:color-mix(in oklab,var(--trace) 18%,transparent);}
  .askrow button:disabled{opacity:.45;cursor:default;}
  .askmsg{margin:.55rem 0 0;font-size:.78rem;}
  .askmsg.err{color:var(--alert);}

  .hint{color:var(--faint);font-size:.78rem;font-family:var(--font-mono);margin-top:.8rem;}
</style>

<div class="top">
  <div class="brand"><b>Architecture Explorer</b><span id="src">govtech_intel</span></div>
  <div class="meta" id="meta"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="schema" aria-selected="true">Schema</button>
    <button class="tab" role="tab" data-view="flows" aria-selected="false">Data flows</button>
    <button class="tab" role="tab" data-view="uis" aria-selected="false">UI surfaces</button>
    <button class="tab" role="tab" data-view="live" aria-selected="false">Live</button>
  </div>
  <button class="tgl" id="tgl" aria-label="Toggle theme">◐</button>
</div>

<div class="body">
  <div class="view on" id="v-schema">
    <aside class="side">
      <div class="search"><input id="q" type="search" placeholder="search tables + fields…" autocomplete="off" spellcheck="false"></div>
      <div class="subfilter" id="subfilter"></div>
      <div class="list" id="list"></div>
    </aside>
    <main class="detail" id="detail"><div class="ov" id="overview"></div></main>
  </div>
  <div class="view" id="v-flows"><div class="flows" id="flows"></div></div>
  <div class="view" id="v-uis"><div class="uis" id="uis"></div></div>
  <div class="view" id="v-live"><div class="liveview" id="live"></div></div>
</div>

<script id="arch-model" type="application/json">/*__ARCH_MODEL__*/</script>
<script>
"use strict";
const M = JSON.parse(document.getElementById('arch-model').textContent);
const SUB = {}; M.subsystems.forEach(s => SUB[s.id] = s);
const hueOf = t => (SUB[M.tables[t]?.subsystem]?.hue ?? 220);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state = { view:'schema', sel:null, sub:null, klass:null, q:'' };
let LIVE = null;
const KLABEL = { live:'live', read_only:'read only', written_unread:'written, never read', untouched:'untouched' };
const KORDER = ['live','read_only','written_unread','untouched'];
let COUNTS = null, COUNT_TOTAL = 0;
const fmt = n => n==null ? '' : n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1)+'M' : n>=1e3 ? (n/1e3).toFixed(n>=1e4?0:1)+'k' : String(Math.round(n));

/* ---------- meta + subsystem filter ---------- */
$('src').textContent = M.meta.source;
function renderMeta(){
  let html = [`${M.meta.tableCount} tables`, `${M.meta.fkCount} FKs`, `mig ${M.meta.migrationHead}`]
    .map(x => `<span class="mchip">${esc(x)}</span>`).join('');
  if (COUNTS) html += `<span class="mchip live" title="planner row estimates (pg_class.reltuples)">~${fmt(COUNT_TOTAL)} rows · live</span>`;
  $('meta').innerHTML = html;
}
renderMeta();

// When embedded in the app (/admin/architecture), pull live per-table row estimates and merge
// them in. Same-origin fetch (CSP connect-src 'self'); the iframe carries the admin session.
// Opened as a file or Claude artifact this 404s and we keep the static schema — graceful.
async function loadStats(){
  try {
    const r = await fetch('/api/admin/architecture/stats', { headers: { Accept: 'application/json' } });
    if (!r.ok) return;
    const j = await r.json();
    const c = j && j.data && j.data.counts;
    if (!c) return;
    COUNTS = c; COUNT_TOTAL = (j.data.total != null) ? j.data.total : Object.values(c).reduce((a, b) => a + b, 0);
    renderMeta(); renderList();
    if (state.view === 'schema' && state.sel) renderDetail(state.sel);
  } catch { /* not running in-app — static schema only */ }
}

function renderSubfilter(){
  const active = state.klass
    ? `<button class="sflag k-${state.klass}" data-klass="${state.klass}" title="clear this filter"
         style="color:var(--k);border-color:var(--k);background:color-mix(in oklab,var(--k) 12%,transparent)">${esc(KLABEL[state.klass])} ×</button>`
    : '';
  $('subfilter').innerHTML = active + M.subsystems.filter(s => tablesIn(s.id).length).map(s => {
    const on = state.sub === s.id;
    const style = `--h:${s.hue};color:hsl(${s.hue} var(--ctsat) var(--ctxt));border-color:hsl(${s.hue} var(--csat) var(--cbd));background:${on?`hsl(${s.hue} var(--csat) var(--cbg))`:'transparent'}`;
    return `<button class="sflag" data-sub="${s.id}" style="${style}">${esc(s.label)}</button>`;
  }).join('');
}
renderSubfilter();

// LIVE SCHEMA — when embedded in the app, read the running DB's actual schema and swap it in, so
// the map reflects new migrations with no regeneration. Same shape as extract.mjs, re-enriched
// here with the committed overlay (subsystem rules stay embedded; traces/uis unchanged). Fails
// silently as a file/artifact → the committed snapshot stands.
function assignSub(name){
  for (const s of M.subsystems){
    if (s.id === 'other') continue;
    if (s.exact && s.exact.includes(name)) return s.id;
    if (s.match && s.match.some(p => name.startsWith(p))) return s.id;
  }
  return 'other';
}
function enrichLive(raw){
  const outBy = {}, inBy = {};
  for (const f of raw.fks){ (outBy[f.table] ??= []).push(f); (inBy[f.refTable] ??= []).push({ fromTable: f.table, col: f.col }); }
  const tables = {};
  for (const [name, t] of Object.entries(raw.tables)){
    const outs = outBy[name] || [];
    const byCol = new Map(outs.map(f => [f.col, f]));
    tables[name] = {
      subsystem: assignSub(name), isView: name.startsWith('v_'), pk: t.pk,
      columns: t.columns.map(c => ({ name: c.name, type: c.type, nullable: c.nullable, pk: t.pk.includes(c.name),
        fk: byCol.has(c.name) ? { refTable: byCol.get(c.name).refTable, refCol: byCol.get(c.name).refCol } : null })),
      out: outs.map(f => ({ col: f.col, refTable: f.refTable, refCol: f.refCol })),
      in: (inBy[name] || []).map(e => ({ fromTable: e.fromTable, col: e.col })),
    };
  }
  return tables;
}
async function loadLiveSchema(){
  try {
    const r = await fetch('/api/admin/architecture/schema', { headers: { Accept: 'application/json' } });
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !j.data || !j.data.tables) return;
    M.tables = enrichLive(j.data);
    M.meta = { ...M.meta, tableCount: Object.keys(M.tables).length, fkCount: j.data.fks.length, live: true };
    if (state.sel && !M.tables[state.sel]) state.sel = null;
    renderMeta(); renderSubfilter(); renderList();
    if (state.view === 'schema') { state.sel ? renderDetail(state.sel) : renderOverview(); }
  } catch { /* not in-app — keep the committed snapshot */ }
}

/* ---------- THE LIVE LAYER ----------------------------------------------------------------
   The first three layers describe what the system IS: the extracted schema, the curated
   subsystems and traces, the UI map. None of them says whether any of it is DOING anything —
   and on a static map a table with nothing on either end looks exactly like a load-bearing one.

   This layer asks the database. `pg_stat_user_tables` counts writes (ins+upd+del) and reads
   (seq_scan+idx_scan) per table, so the map can paint what is live, what is only read, what is
   WRITTEN AND NEVER READ (a producer with no consumer, stated by Postgres rather than inferred),
   and what nothing has touched at all.

   ⚠️ THE EPOCH IS THE INSTRUMENT. Those counters run from `pg_stat_database.stats_reset`, which
   is very often NULL — the database is not telling us how far back they go. When it is unknown
   this view says "not touched in this reading" and NOT "nothing writes this", because the second
   is a claim the evidence does not support. See lib/architecture-live.ts. */

async function loadLive(){
  try {
    const r = await fetch('/api/admin/architecture/live', { headers: { Accept: 'application/json' } });
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !j.data || !j.data.tables) return;
    LIVE = j.data;
    renderSubfilter(); renderList();
    if (state.view === 'live') renderLive();
    if (state.view === 'schema' && state.sel) renderDetail(state.sel);
  } catch { /* opened as a file — the map keeps its three static layers */ }
}

const ago = iso => {
  const ms = Date.now() - Date.parse(iso);
  if (!isFinite(ms)) return '';
  const h = ms/3.6e6;
  return h < 1 ? `${Math.max(1,Math.round(h*60))}m` : h < 48 ? `${Math.round(h)}h` : `${Math.round(h/24)}d`;
};

function renderLive(){
  if (!LIVE){
    $('live').innerHTML = `<div class="epoch unanchored"><b>The live layer is not available here.</b>
      <p>It reads the running database through <code>/api/admin/architecture/live</code>, so it only
      appears when this explorer is opened inside the app at <code>/admin/architecture</code> by an
      rfp_admin. The schema, flows and UI tabs are self-contained and work anywhere.</p></div>`;
    return;
  }
  const L = LIVE, anchored = !!L.anchored;

  // The banner is the honest part. Everything below it means something different depending on
  // whether we know when the counters started, so that fact leads rather than sits in a footnote.
  // THE SPAN IS STATED, NEVER JUDGED. A first draft here said a table with no writes "in a span
  // this long" was a genuine finding — and then the very first anchored reading was one minute old
  // and showed 121 untouched tables under that sentence. There is no principled threshold: whether
  // silence means anything depends entirely on what was driven. So the span is reported exactly and
  // the reader judges, which is the only version of this that cannot be confidently wrong.
  const span = anchored ? ago(L.statsSince) : null;
  const epoch = anchored
    ? `<div class="epoch"><b>Counters anchored ${esc(span)} ago — ${esc(L.statsSince.slice(0,16).replace('T',' '))} UTC</b>
        <p>Every number below is activity in exactly that span, and nothing below is a claim about
        anything outside it. Whether a quiet table means something depends on what you drove: after a
        full lane sweep it is a finding, ${esc(span)} after a reset it is just a short reading.</p></div>`
    : `<div class="epoch unanchored"><b>Unanchored — Postgres does not know when these counters started.</b>
        <p><code>pg_stat_database.stats_reset</code> is null, so the counts below are real but their
        span is not. Read them as <em>coverage of this reading</em>: “nothing touched this table”
        here does <strong>not</strong> mean “nothing writes this table”. To anchor it — and turn
        this into a coverage map for a live drive — reset at a known moment, drive the product,
        then come back:</p>
        <p><code>psql "$DATABASE_URL_OWNER" -c 'SELECT pg_stat_reset()'</code>
        ${L.serverStart ? ` &nbsp;·&nbsp; this server started ${ago(L.serverStart)} ago` : ''}</p></div>`;

  const chips = KORDER.map(k => `<button class="kchip k-${k}" data-klass="${k}" aria-pressed="${state.klass===k}">
      <span class="kn">${L.counts[k] ?? 0}</span><span class="kl">${esc(KLABEL[k])}</span></button>`).join('');

  const max = L.hottest.length ? L.hottest[0].writes : 1;
  const bars = L.hottest.length ? L.hottest.map(h => `<button class="bar" data-nav="t:${esc(h.table)}">
      <span class="bn">${esc(h.table)}</span>
      <span class="bt" style="width:${Math.max(2, Math.round(h.writes/max*100))}%"></span>
      <span class="bv">${fmt(h.writes)}</span></button>`).join('')
    : `<span class="lempty">no writes recorded in this reading</span>`;

  const chipList = (arr) => arr.length
    ? arr.map(t => M.tables[t]
        ? `<button class="rchip" data-nav="t:${esc(t)}">${esc(t)}</button>`
        : `<span class="rchip" style="opacity:.5" title="in the database, not in this map's snapshot">${esc(t)}</span>`).join('')
    : `<span class="lempty">none</span>`;

  $('live').innerHTML = epoch + `<div class="kchips">${chips}</div>
    <div class="lgrid">
      <div class="lcard"><h4><span>Written and never read</span><span>${L.writtenUnread.length}</span></h4>
        <div class="bd">
          <p class="why">Rows go in and nothing ever selects them. This is the producer-with-no-consumer
          shape the whole asymmetry sweep was about — and unlike the others it is a defect shape
          whatever the epoch is, because the writes and the absent reads are counted over the same span.</p>
          <div class="tlist">${chipList(L.writtenUnread)}</div>
        </div></div>

      <div class="lcard"><h4><span>Not touched ${anchored ? `in the last ${esc(span)}` : 'in this reading'}</span><span>${L.untouched.length}</span></h4>
        <div class="bd">
          <p class="why">${anchored
            ? `Nothing wrote or read these in the ${esc(span)} since the counters were anchored. That `
              + 'is coverage of a drive, not a verdict on a table — a capability nobody exercised in '
              + 'that span lands here exactly like one nothing can reach. The list earns weight from '
              + 'what you drove, so drive deliberately and then read it.'
            : 'Nothing touched these during this reading. With no epoch that is a statement about '
              + 'the reading, not about the table: it is coverage, and the honest use of it is to '
              + 'anchor the counters first and drive the product.'}</p>
          <div class="tlist">${chipList(L.untouched)}</div>
        </div></div>

      <div class="lcard"><h4><span>Busiest by writes</span><span>${L.hottest.length}</span></h4>
        <div class="bd"><div class="bars">${bars}</div></div></div>
    </div>

    <div class="askbox">
      <div class="askrow">
        <input id="ask-doing" type="text" maxlength="500" autocomplete="off"
          placeholder="what you were just doing — optional, and the most useful thing here">
        <button id="ask-go">Ask the companion (60m)</button>
      </div>
      <p class="askmsg" id="ask-msg" style="color:var(--faint)">Advisory only: it reads the same
        telemetry window you can see at <code>/admin/observe</code>, plus this activity picture and
        the findings the arithmetic already computed, and answers with a MECHANISM and a CHANGE. It
        will not tell you things are fine — an empty window means nothing happened, not that nothing
        is wrong. How it works, how to ask well and what it cannot see:
        <a href="/admin/observe" target="_top">the guide on Observe</a>.</p>
    </div>
    <p class="hint">Counters from pg_stat_user_tables. Reads include our own harnesses and lenses —
      a table can look busy because a sweep walked it.</p>`;
}

/* Ask the companion. A doorbell, not a call: this POSTs an event and the agent fabric picks it up
   under its own spend caps, rate limits and kill switch. A direct model call from here would be
   the one AI request on the platform that no cap could stop. */
async function askCompanion(){
  const btn = $('ask-go'), msg = $('ask-msg'), inp = $('ask-doing');
  if (!btn) return;
  btn.disabled = true; btn.textContent = 'Asking…';
  msg.className = 'askmsg'; msg.style.color = 'var(--faint)';
  try {
    const r = await fetch('/api/admin/observe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ minutes: 60, doing: (inp.value || '').trim() || null }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok){ msg.className = 'askmsg err'; msg.style.color = ''; msg.textContent = j.error || `HTTP ${r.status}`; }
    else msg.textContent = 'Asked. It runs under the platform spend caps; its read appears in /admin/agents.';
  } catch {
    msg.className = 'askmsg err'; msg.style.color = ''; msg.textContent = 'Network error — the request did not go.';
  }
  btn.disabled = false; btn.textContent = 'Ask the companion (60m)';
}

function tablesIn(sub){ return Object.keys(M.tables).filter(t => M.tables[t].subsystem === sub); }

/* ---------- sidebar list ---------- */
function renderList(){
  const q = state.q.trim().toLowerCase();
  const match = t => {
    if (state.sub && M.tables[t].subsystem !== state.sub) return false;
    // The activity filter only applies once the live layer has loaded. A table the map knows but
    // pg_stat does not (a view) has no class and is filtered out rather than guessed at.
    if (state.klass && (!LIVE || (LIVE.tables[t] || {}).klass !== state.klass)) return false;
    if (!q) return true;
    if (t.toLowerCase().includes(q)) return true;
    return M.tables[t].columns.some(c => c.name.toLowerCase().includes(q));
  };
  let html = '';
  for (const s of M.subsystems){
    const ts = tablesIn(s.id).filter(match).sort();
    if (!ts.length) continue;
    html += `<div class="grp"><span class="gc" style="background:hsl(${s.hue} var(--ctsat) 50%)"></span>${esc(s.label)} · ${ts.length}</div>`;
    for (const t of ts){
      const tb = M.tables[t];
      const act = LIVE && LIVE.tables[t] ? LIVE.tables[t].klass : null;
      html += `<button class="trow" data-nav="t:${esc(t)}" aria-current="${state.sel===t}">`+
        `<span class="tdot" style="background:hsl(${s.hue} var(--ctsat) 50%)"></span>`+
        `<span class="tn">${esc(t)}</span>`+
        (act ? `<span class="adot k-${act}" title="${esc(KLABEL[act])}"></span>` : '')+
        `<span class="tm">${tb.columns.length}c·${tb.out.length}fk${COUNTS&&COUNTS[t]!=null?` · ${fmt(COUNTS[t])}`:''}</span></button>`;
    }
  }
  $('list').innerHTML = html || `<div class="gempty">no match</div>`;
}

/* ---------- neighborhood graph (deterministic SVG + foreignObject) ---------- */
function graph(name){
  const t = M.tables[name];
  const CAP = 8;
  const ins = t.in.slice(0, CAP), outs = t.out.slice(0, CAP);
  const rows = Math.max(ins.length, outs.length, 1);
  const RH = 58, TOP = 26, NW = 176, NH = 44, W = 960;
  const H = TOP*2 + (rows-1)*RH + NH;
  const cy = (H - NH)/2, cx = (W - 180)/2; // center node x
  const yFor = (i, n) => TOP + (H - TOP*2 - NH)/2 - ((n-1)*RH)/2 + i*RH;
  const anchorL = 40 + NW, anchorR = cx, aOutL = cx + 180, aOutR = W - 40 - NW;
  let paths = '', nodes = '';
  // center
  nodes += fo(cx, cy, 180, `<div class="gnode center" style="--h:${hueOf(name)}"><b>${esc(name)}</b></div>`);
  ins.forEach((e, i) => {
    const y = yFor(i, ins.length);
    paths += edge(anchorL, y+NH/2, anchorR, cy+NH/2, 'in', e.col);
    nodes += fo(40, y, NW, gnode(e.fromTable, '.'+e.col+' →'));
  });
  outs.forEach((e, i) => {
    const y = yFor(i, outs.length);
    paths += edge(aOutL, cy+NH/2, aOutR, y+NH/2, 'out', e.col);
    nodes += fo(W-40-NW, y, NW, gnode(e.refTable, '→ .'+e.refCol));
  });
  const moreI = t.in.length - ins.length, moreO = t.out.length - outs.length;
  const cap = (moreI>0||moreO>0) ? `<div class="hint">graph shows ${ins.length}/${t.in.length} inbound · ${outs.length}/${t.out.length} outbound — full lists below</div>` : '';
  if (!ins.length && !outs.length)
    return `<div class="graph-wrap"><div class="gempty">no foreign-key relationships</div></div>${cap}`;
  return `<div class="graph-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="foreign-key neighborhood of ${esc(name)}">
    <defs>
      <marker id="aIn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--loop)"/></marker>
      <marker id="aOut" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--trace)"/></marker>
    </defs>${paths}${nodes}</svg></div>${cap}`;
}
function gnode(tbl, sub){ return `<div class="gnode" style="--h:${hueOf(tbl)}" data-nav="t:${esc(tbl)}"><b>${esc(tbl)}</b><small>${esc(sub)}</small></div>`; }
function fo(x, y, w, inner){ return `<foreignObject x="${x}" y="${y}" width="${w}" height="44"><div xmlns="http://www.w3.org/1999/xhtml">${inner}</div></foreignObject>`; }
function edge(x1,y1,x2,y2,dir,label){
  const mx=(x1+x2)/2, c1=x1+(x2-x1)*0.42, c2=x2-(x2-x1)*0.42;
  const col = dir==='in' ? 'var(--loop)' : 'var(--trace)';
  const mk = dir==='in' ? 'aIn' : 'aOut';
  const lx=(x1+x2)/2, ly=(y1+y2)/2;
  return `<path d="M${x1},${y1} C${c1},${y1} ${c2},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="1.4" opacity=".55" marker-end="url(#${mk})"/>`+
    `<rect x="${lx-label.length*3.4-4}" y="${ly-8}" width="${label.length*6.8+8}" height="15" rx="3" fill="var(--surface)" opacity=".92"/>`+
    `<text x="${lx}" y="${ly+3}" text-anchor="middle" font-family="var(--font-mono)" font-size="9.5" fill="var(--muted)">${esc(label)}</text>`;
}

/* ---------- table detail ---------- */
function renderDetail(name){
  const t = M.tables[name];
  const rels = (arr, dir) => arr.map(e => {
    const tbl = dir==='out' ? e.refTable : e.fromTable;
    const via = dir==='out' ? `${e.col} → .${e.refCol}` : `.${e.col}`;
    return `<button class="rchip" data-nav="t:${esc(tbl)}">${esc(tbl)} <span class="via">${esc(via)}</span></button>`;
  }).join('') || `<span class="hint">none</span>`;
  const fieldRows = t.columns.map(c => {
    let key = '';
    if (c.pk) key += `<span class="kpk">PK</span> `;
    if (c.fk) key += `<span class="kfk" data-nav="t:${esc(c.fk.refTable)}">FK → ${esc(c.fk.refTable)}</span>`;
    return `<tr><td class="fn">${esc(c.name)}</td><td class="ft">${esc(c.type)}</td>`+
      `<td>${c.nullable?'<span class="nn">null</span>':'<span class="nn" style="color:var(--good)">not&nbsp;null</span>'}</td>`+
      `<td>${key}</td></tr>`;
  }).join('');
  $('detail').innerHTML = `
    <div class="dhead">
      <h2>${esc(name)}</h2>
      <span class="subchip" style="--h:${hueOf(name)}">${esc(SUB[t.subsystem].label)}</span>
      ${t.isView?'<span class="badge">view</span>':''}
      <span class="badge">${t.columns.length} fields</span>
      <span class="badge">${t.out.length} out · ${t.in.length} in</span>
      ${COUNTS && COUNTS[name]!=null ? `<span class="badge live">~${fmt(COUNTS[name])} rows</span>` : ''}
      ${LIVE && LIVE.tables[name] ? (a => `<span class="badge act k-${a.klass}" title="${LIVE.anchored
          ? 'since ' + esc(LIVE.statsSince.slice(0,16).replace('T',' ')) + ' UTC'
          : 'unanchored reading — the span of these counters is unknown'
        }">${esc(KLABEL[a.klass])} · ${fmt(a.writes)}w ${fmt(a.reads)}r</span>`)(LIVE.tables[name]) : ''}
    </div>
    <div class="sectitle">Foreign-key neighborhood</div>
    ${graph(name)}
    <div class="sectitle">Fields</div>
    <div class="fwrap"><table class="fields"><thead><tr><th>column</th><th>type</th><th>null</th><th>key</th></tr></thead><tbody>${fieldRows}</tbody></table></div>
    <div class="sectitle">Relationships</div>
    <div class="rels">
      <div class="rel"><h4>References (out) → ${t.out.length}</h4><div class="relchips">${rels(t.out,'out')}</div></div>
      <div class="rel"><h4>Referenced by (in) ← ${t.in.length}</h4><div class="relchips">${rels(t.in,'in')}</div></div>
    </div>`;
  $('detail').scrollTop = 0;
}

function renderOverview(){
  const cards = M.subsystems.filter(s=>tablesIn(s.id).length).map(s => {
    const n = tablesIn(s.id).length;
    return `<button class="subcard" data-sub="${s.id}" style="--h:${s.hue}"><span class="n">${n} tables</span><b>${esc(s.label)}</b></button>`;
  }).join('');
  $('detail').innerHTML = `<div class="ov">
    <h3>${M.meta.tableCount} tables, ${M.meta.fkCount} foreign keys</h3>
    <p>The live <span class="mono">${esc(M.meta.source)}</span> schema at migration head ${M.meta.migrationHead}, grouped by subsystem. Pick a table to see its fields, its foreign-key neighborhood, and everything that references it — or start from a real data flow.</p>
    <div class="subgrid">${cards}</div>
    <p class="hint">Every table, field, type and FK is extracted from the migrated database — re-run <span class="mono">scripts/architecture/{extract,generate}.mjs</span> to refresh.</p>
  </div>`;
}

/* ---------- flows ---------- */
function renderFlows(){
  $('flows').innerHTML = M.traces.map(tr => {
    const steps = tr.steps.map((s,i) => {
      const node = `<div class="fnode ${s.table?'tbl':''}" ${s.table?`data-nav="t:${esc(s.table)}"`:''}><span class="pl">${esc(s.plane)}</span><span class="id">${esc(s.label)}</span></div>`;
      const arr = i < tr.steps.length-1 ? `<div class="far">${s.plane==='Agents'||tr.steps[i+1]?.plane==='UI'&&tr.kind==='loop'?'↩':'→'}</div>` : '';
      return node + arr;
    }).join('');
    return `<div class="trace ${tr.kind==='loop'?'loop':''}">
      <div class="h"><span class="tg">TRACE ${esc(tr.id)}</span><span class="nm">${esc(tr.name)}</span></div>
      <div class="flow">${steps}</div>
      <p class="tnote">${esc(tr.note)}</p></div>`;
  }).join('') + `<p class="hint">Table nodes are clickable — they jump to the schema view. Mirrors docs/DATA_FLOW.md.</p>`;
}

/* ---------- uis ---------- */
function renderUis(){
  $('uis').innerHTML = `<div class="uigrid">` + M.uis.map(u => {
    const chips = u.tables.map(t => M.tables[t]
      ? `<button class="rchip" data-nav="t:${esc(t)}">${esc(t)}</button>`
      : `<span class="rchip" style="opacity:.5">${esc(t)}</span>`).join('');
    return `<div class="uicard"><b>${esc(u.label)}</b><div class="rt">${esc(u.route)}</div><div class="relchips">${chips}</div></div>`;
  }).join('') + `</div><p class="hint">Key surfaces and the tables they read or write. Click a table to inspect it.</p>`;
}

/* ---------- view switching ---------- */
function setView(v){
  state.view = v;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.view===v));
  document.querySelectorAll('.view').forEach(el => el.classList.remove('on'));
  $('v-'+v).classList.add('on');
  if (v==='flows') renderFlows();
  if (v==='uis') renderUis();
  if (v==='live') renderLive();
  syncHash();
}
function select(name){
  if (!M.tables[name]) return;
  state.sel = name; state.view='schema';
  setView('schema');
  renderList(); renderDetail(name);
  syncHash();
  const row = document.querySelector(`.trow[data-nav="t:${cssq(name)}"]`);
  if (row) row.scrollIntoView({block:'nearest'});
}
const cssq = s => s.replace(/["\\]/g,'\\$&');

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('#ask-go')){ askCompanion(); return; }
  // A class chip is a lens on the MAP, not just a number: it drops you into the schema list
  // filtered to those tables, so "show me everything nothing has touched" is one click.
  const kl = e.target.closest('[data-klass]');
  if (kl){
    const wasLive = state.view === 'live';
    state.klass = state.klass===kl.dataset.klass ? null : kl.dataset.klass;
    state.sel = null;
    renderSubfilter();
    if (state.klass){ setView('schema'); renderList(); renderOverview(); }
    else if (wasLive) renderLive();
    else { renderList(); renderOverview(); }
    return;
  }
  const nav = e.target.closest('[data-nav]');
  if (nav){ const [k,v] = nav.dataset.nav.split(':'); if (k==='t') select(v); return; }
  const sub = e.target.closest('[data-sub]');
  if (sub){ state.sub = state.sub===sub.dataset.sub ? null : sub.dataset.sub; state.sel=null; refreshSub(); setView('schema'); renderList(); renderOverview(); return; }
  const tab = e.target.closest('.tab');
  if (tab){ setView(tab.dataset.view); return; }
});
$('q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('tgl').addEventListener('click', () => {
  const r = document.documentElement; const cur = r.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  r.setAttribute('data-theme', cur==='dark'?'light':'dark');
});
function refreshSub(){
  document.querySelectorAll('.sflag').forEach(b => {
    const on = b.dataset.sub===state.sub, h = SUB[b.dataset.sub].hue;
    b.style.background = on ? `hsl(${h} var(--csat) var(--cbg))` : 'transparent';
  });
}

/* ---------- hash routing (deep-linkable for review) ---------- */
function syncHash(){
  let h = '#'+state.view;
  if (state.view==='schema' && state.sel) h = '#t/'+state.sel;
  if (location.hash !== h) history.replaceState(null,'',h);
}
function fromHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('t/')) { select(h.slice(2)); return; }
  if (h==='flows'||h==='uis'||h==='live') { setView(h); return; }
  setView('schema'); renderOverview();
}
window.addEventListener('hashchange', fromHash);

/* ---------- boot ---------- */
renderList();
fromHash();
loadLiveSchema().then(loadStats).then(loadLive);

</script>
